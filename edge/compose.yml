# Shared public edge: the only thing that publishes host ports 80/443. One
# nginx terminates TLS for every project's domains (Musify, ...) and
# proxies to their containers by name, over the networks below. Certificates
# come from Let's Encrypt (webroot), renewed by the certbot service.
#
#   docker compose -f edge/compose.yml up -d
#
# Requires `infra-net` (created by ../compose.yml) to already exist.
#
# Other projects attach to the edge with a compose overlay (extra network +
# a vhost mounted into /etc/nginx/vhosts.d/), e.g.:
#   docker compose -f edge/compose.yml -f ../Gitea/edge/compose.yml up -d

name: edge

# Docker's default json-file driver never rotates, so logs would grow until
# the disk fills up.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  infra-net:
    name: infra-net
    external: true

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: edge-nginx
    # The subshell reloads nginx every 6h so renewed certificates get picked up.
    command:
      - /bin/sh
      - -c
      - "(while :; do sleep 6h; nginx -s reload; done) & exec nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks: [infra-net]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.8.0
    container_name: edge-certbot
    entrypoint:
      - /bin/sh
      - -c
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
