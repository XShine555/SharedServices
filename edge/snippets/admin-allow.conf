# Who may reach administrative surfaces (Zitadel console and management APIs,
# API docs). Include it inside a location. Loopback and private ranges are
# allowed (VPN / LAN); add the fixed public IP of an administrator below.
# Everything else gets 403.
allow 127.0.0.1;
allow ::1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
# allow 203.0.113.10;
deny all;
