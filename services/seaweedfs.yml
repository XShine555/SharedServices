# S3-compatible object store. All-in-one: master + volume + filer + S3
# gateway. The S3 identities are rendered on start from projects/*.env
# (provision/seaweedfs-s3-config.sh): an admin one for this stack, and one per
# project limited to its own bucket. Each project's own seaweedfs-init creates
# its bucket.
services:
  seaweedfs:
    extends:
      file: services/_defaults.yml
      service: defaults
    image: chrislusf/seaweedfs:4.47
    container_name: infra-seaweedfs
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sh /provision/seaweedfs-s3-config.sh >/tmp/s3.conf || exit 1
        exec weed server \
          -ip.bind=0.0.0.0 \
          -dir=/data \
          -master.volumeSizeLimitMB=1024 \
          -volume.max=0 \
          -filer \
          -s3 \
          -s3.config=/tmp/s3.conf
    volumes:
      - seaweedfs_data:/data
      - ./provision:/provision:ro
      - ./projects:/projects:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9333/cluster/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  seaweedfs_data:
