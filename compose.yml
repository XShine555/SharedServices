# Shared infrastructure: identity, database, object storage, messaging and
# tracing. It knows nothing about who uses it: consumers register themselves
# by adding a file to projects/.
#
# This is the production shape: no published ports, no domains. Everything is
# reachable only on `infra-net`. Development adds the ports with compose.dev.yml.
#
#   dev   docker compose -f compose.yml -f compose.dev.yml up -d
#   prod  docker compose --env-file .env.prod -f compose.yml up -d
#
# Each service is its own file under services/. To add or drop one, add or
# remove its line below. To add a project, drop a file in projects/ (no edit
# here).
include:
  - path:
      - services/network.yml
      - services/postgres.yml
      - services/zitadel.yml
      - services/seaweedfs.yml
      - services/rabbitmq.yml
      - services/jaeger.yml
      - services/provision.yml
    project_directory: .
